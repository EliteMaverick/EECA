<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin | Eternal Excellence Christian Academy</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-soft">
<!-- PRIVATE PAGE: not linked from the public site. Share the address only with staff who manage events. -->
<div class="container py-4" style="max-width:1000px">
 <div class="d-flex justify-content-between align-items-center mb-4">
  <div><a class="brand" href="index.html"><span>Eternal Excellence<i>.</i></span></a><div class="small text-muted">School admin</div></div>
  <button id="out" class="btn btn-outline-primary btn-sm" hidden>Log out</button>
 </div>
 <div id="msg" class="alert" role="status" hidden></div>
 <div id="cfg" class="alert alert-warning" hidden>The admin is not connected yet. Open <code>js/config.js</code> and follow <strong>SETUP-ADMIN.md</strong>.</div>

 <div id="login" class="card-x mx-auto" style="max-width:420px">
  <h1 class="h4 mb-3">Admin login</h1>
  <form id="loginForm" class="row g-3">
   <div class="col-12"><label class="form-label" for="em">Email</label><input id="em" type="email" class="form-control" required autocomplete="username"></div>
   <div class="col-12"><label class="form-label" for="pw">Password</label><input id="pw" type="password" class="form-control" required autocomplete="current-password"></div>
   <div class="col-12 d-grid"><button class="btn btn-primary" type="submit">Log in</button></div>
  </form>
 </div>

 <div id="app" class="row g-4" hidden>
  <div class="col-lg-6">
   <div class="card-x">
    <h2 class="h5" id="formTitle">Add a new event</h2>
    <form id="evForm" class="row g-3">
     <div class="col-12"><label class="form-label" for="title">Event title *</label><input id="title" class="form-control" required maxlength="120"></div>
     <div class="col-md-6"><label class="form-label" for="when">Date &amp; time *</label><input id="when" type="datetime-local" class="form-control" required></div>
     <div class="col-md-6"><label class="form-label" for="venue">Venue</label><input id="venue" class="form-control" maxlength="120"></div>
     <div class="col-12"><label class="form-label" for="desc">Description / write-up</label><textarea id="desc" rows="5" class="form-control"></textarea>
      <div class="form-text">For upcoming events, describe what will happen. After the event, edit it and write what happened.</div></div>
     <div class="col-12"><label class="form-label" for="cover">Cover photo</label><input id="cover" type="file" accept="image/*" class="form-control"></div>
     <div class="col-12"><label class="form-label" for="gallery">Gallery photos (you can choose many)</label><input id="gallery" type="file" accept="image/*" multiple class="form-control"></div>
     <div class="col-12" id="thumbs"></div>
     <div class="col-12 d-flex gap-2"><button id="saveBtn" class="btn btn-primary" type="submit">Save event</button><button id="reset" class="btn btn-outline-secondary" type="button">Clear form</button></div>
    </form>
   </div>
  </div>
  <div class="col-lg-6">
   <div class="card-x"><h2 class="h5">All events</h2><div id="list" class="list-group list-group-flush"><div class="text-muted small">Loading...</div></div></div>
  </div>
 </div>
</div>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
